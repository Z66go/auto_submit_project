name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Start Backend Service
        run: |
          # 1. 智能查找 app.py 的绝对路径（注意：这里找的是 app.py）
          echo "Searching for app.py in entire project..."
          APP_FILE=$(find . -name "app.py" -type f | head -n 1)
          APP_DIR=$(dirname "$APP_FILE")

          echo "Found app.py at: $APP_FILE"
          echo "Project Dir: $APP_DIR"

          # 2. 打印一下该目录下的文件，确保 app.py 真的在这里
          echo "Files in the directory:"
          ls -l "$APP_DIR"

          # 3. 启动服务（使用全路径，绝对安全，不会被切目录搞乱）
          echo "Starting server..."
          nohup python -u "$APP_DIR/app.py" > "$APP_DIR/server.log" 2>&1 &

          # 4. 等待服务真正启动成功
          ATTEMPTS=0
          echo "Waiting for server to start..."
          while ! curl --output /dev/null --silent --head --fail http://localhost:5000 && [ $ATTEMPTS -lt 30 ]; do
            ATTEMPTS=$((ATTEMPTS+1))
            sleep 1
          done

          if [ $ATTEMPTS -ge 30 ]; then
            echo "❌ Server failed to start within 30 seconds. Log:"
            cat "$APP_DIR/server.log"
            exit 1
          fi

          echo "✅ Backend service is up and running!"

      - name: Run tests
        run: pytest tests/ -v