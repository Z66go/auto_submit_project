name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Start Backend Service
        run: |
          # 1. 智能查找 main.py 的绝对路径
          echo "Searching for main.py in entire project..."
          MAIN_FILE=$(find . -name "main.py" -type f | head -n 1)
          MAIN_DIR=$(dirname "$MAIN_FILE")
          
          echo "Found main.py at: $MAIN_FILE"
          echo "Switching to directory: $MAIN_DIR"

          # 2. 切换到 main.py 所在的真实目录
          cd "$MAIN_DIR"

          # 3. 在当前目录下启动 Flask 服务
          # 注意：这里假设 main.py 启动的端口是 5000，如果本地是 8000 请自行修改
          echo "Starting server..."
          nohup python -u main.py > server.log 2>&1 &
          
          # 4. 等待服务真正启动成功
          ATTEMPTS=0
          while ! curl --output /dev/null --silent --head --fail http://localhost:5000 && [ $ATTEMPTS -lt 30 ]; do
            ATTEMPTS=$((ATTEMPTS+1))
            sleep 1
          done

          if [ $ATTEMPTS -ge 30 ]; then
            echo "❌ Server failed to start within 30 seconds. Log:"
            cat server.log
            exit 1
          fi
          
          echo "✅ Backend service is up and running!"

      - name: Run tests
        run: pytest tests/ -v