name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Start Backend Service
        run: |
          python -u main.py > server.log 2>&1 &
          
          # 增加重试机制，确保网站真正启动完毕
          ATTEMPTS=0
          while ! curl --output /dev/null --silent --head --fail http://localhost:5000 && [ $ATTEMPTS -lt 20 ]; do
            ATTEMPTS=$((ATTEMPTS+1))
            echo "Waiting for server to start... ($ATTEMPTS)"
            sleep 1
          done
          
          if [ $ATTEMPTS -ge 20 ]; then
            echo "Server failed to start within 20 seconds."
            cat server.log
            exit 1
          fi
          echo "Backend service is up and running on port 5000!"

      - name: Run tests
        run: pytest tests/ -v