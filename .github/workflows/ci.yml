      - name: Start Backend Service
        run: |
          # 加上子文件夹前缀，并用 nohup 确保后台稳定运行
          nohup python -u auto_submit_project/main.py > server.log 2>&1 &
          
          # 强力等待服务真正启动成功
          ATTEMPTS=0
          while ! curl --output /dev/null --silent --head --fail http://localhost:5000 && [ $ATTEMPTS -lt 30 ]; do
            ATTEMPTS=$((ATTEMPTS+1))
            echo "Waiting for server to start... ($ATTEMPTS)"
            sleep 1
          done
          
          if [ $ATTEMPTS -ge 30 ]; then
            echo "Server failed to start within 30 seconds. Server log:"
            cat server.log
            exit 1
          fi
          echo "✅ Backend service is up and running on port 5000!"